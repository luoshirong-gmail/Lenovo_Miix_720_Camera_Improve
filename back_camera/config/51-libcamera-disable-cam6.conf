# WirePlumber 规则：禁用 CAM6 (OV5670/IPU3 后置) 的 libcamera 暴露
# 背景：ov5670-router 需要独占 CAM6 (libcamerasrc)。wireplumber/pipewire 的
# libcamera monitor 探测 CAM6 时会持有 /dev/video1 (IPU3 imgu 节点) 不释放
# → router 的 libcamerasrc 打开时 "Camera is already in use" / acquire EBUSY
# → cam 链无数据 → 虚拟摄像头黑屏。
# CAM6 只通过 /dev/video98 (router 转发) 提供给应用，不需要在 PipeWire 暴露。
# 保留 USB 前置 (XHC / 04f2:b5b8, api.libcamera.path 含 XHC) 的 libcamera 通道。
# ⚠️ 匹配 api.libcamera.path (原始路径, 不经 gsub; device.name 会被
# name-device.lua gsub 转义, 匹配不可靠)。JSON 中 \\ 表示字面反斜杠。

monitor.libcamera.rules = [
  {
    matches = [
      {
        api.libcamera.path = "\\_SB_.PCI0.I2C2.CAM6"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
