# WirePlumber 规则：禁用原始 EASYCAMERA 的 libcamera 暴露
#
# 背景：camera-enhancement.service 用 GStreamer GL pipeline 读取 /dev/video14
# 增强后输出到 /dev/video99 (EnhancedCamera)。PipeWire libcamera monitor
# 也会注册原始 EasyCamera（USB 摄像头），导致应用打开原始源时访问
# video14 被 pipeline 独占 → "设备或资源忙" → "could not play camera stream"。
#
# 匹配键：USB 摄像头的 libcamera 路径含 XHC（USB controller），
# 内置 ov5670 是 I2C2，不会被匹配。
# 注意：create-device 阶段 api.libcamera.path 是单个反斜杠（\_SB_），
# 配置里用 \_SB_ 精确匹配（不能用双反斜杠，会匹配失败）。
#
# 安装：cp 到 ~/.config/wireplumber/wireplumber.conf.d/
# 生效：systemctl --user restart wireplumber

monitor.libcamera.rules = [
  {
    matches = [
      {
        # USB 摄像头路径含 XHC（USB controller）
        api.libcamera.path = "\\_SB_.PCI0.XHC_.RHUB.HSP4-4:1.0-04f2:b5b8"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
