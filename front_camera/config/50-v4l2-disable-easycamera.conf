# WirePlumber 规则：禁用原始 EASYCAMERA 的 v4l2 暴露
#
# 背景：camera-enhancement.service 用 GStreamer GL pipeline 读取 /dev/video14
# 增强后输出到 /dev/video99 (EnhancedCamera)。PipeWire v4l2 monitor 会注册
# 原始 EasyCamera，导致应用打开原始源时访问 video14 被 pipeline 独占 →
# "设备或资源忙" → "could not play camera stream"。
#
# 安装：cp 到 ~/.config/wireplumber/wireplumber.conf.d/
# 生效：systemctl --user restart wireplumber

monitor.v4l2.rules = [
  {
    matches = [
      {
        # 原始 EASYCAMERA 视频设备
        api.v4l2.path = "/dev/video14"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      {
        # EASYCAMERA metadata 设备
        api.v4l2.path = "/dev/video15"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
