# Lenovo MIIX 720 Camera Improve - v4l2loopback module options (统一配置)
# =====================================================================
# 合并自 (2026-08-08, 合并项目 P4):
#   - usb-camera-enhancement.conf   (前置增强项目: video99)
#   - ov5670-virtual-camera.conf    (后置虚拟摄像头项目: video16)
# 两项目共享同一内核模块 v4l2loopback, 参数完全一致, 合并为单文件消除
# 字母序覆盖耦合 (旧方案: ov5670 < usb 靠字母序后读覆盖, 脆弱)。
#
# exclusive_caps=0: 设备同时声明 CAPTURE+OUTPUT。
#   - wireplumber 才能为 video99/video16 创建 Video/Source Node
#     (exclusive_caps=1 有 writer 时只显示 OUTPUT → 相机应用不枚举)
#   - D-1 v4 补丁让 ENUM_FMT 只返回 writer 实际格式 (NV12), 避免
#     spa-v4l2 枚举 RGB 系列导致 PipeWire 协商 EINVAL (-22)
# max_width/max_height=3840x2160: 双设备的最大尺寸上限
#   - video99: 前置增强输出 1920x1080 (GL 管线)
#   - video16: 后置 OV5670 输出 2560x1920 (libcamera 转发)
# max_buffers=16: 缓冲池 2→16 修复 PipeWire 消费慢时 writer 背压冻结卡顿
# card_label=EnhancedCamera video_nr=99: 归前置增强项目 (video99 静态设备)
#   - video16 由 v4l2loopback-ctl add 动态创建, 不在此配置
# ⚠️ 2026-08-09: 模块加载由 v4l2loopback-load.service (modprobe 命令) 负责 —
#   systemd-modules-load (kmod 库) 解析 modprobe.d options 不完整 (card_label
#   等未传) → add 设备 AF 控件 0/3; 且 modules-load.d 被打包进 initramfs 时
#   initrd 阶段预加载 → root 阶段改动无效。见 back_camera/README.md 构建说明。
options v4l2loopback exclusive_caps=0 max_width=3840 max_height=2160 max_buffers=16 card_label=EnhancedCamera video_nr=99
