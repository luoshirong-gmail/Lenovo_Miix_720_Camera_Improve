# Lenovo MIIX 720 Camera Improve - load v4l2loopback at boot (统一配置)
# =====================================================================
# 合并自 (2026-08-08, 合并项目 P4):
#   - usb-camera-enhancement.conf   (原启用, 后 .disabled)
#   - ov5670-virtual-camera.conf    (原启用)
# 两文件内容相同 (仅模块名), 合并为单文件。
# module options 在 /etc/modprobe.d/camera-improve-v4l2loopback.conf,
# modules-load.d 只写模块名 (options 行会被 systemd 忽略)。
#
# ⚠️ 2026-08-09 (initramfs 根治): v4l2loopback 已注释 —
#   1) systemd-modules-load (kmod 库) 加载时 modprobe.d options 解析不完整
#      (card_label 等未传) → add 设备 AF 控件 0/3 (手动 modprobe 则 3/3)。
#   2) modules-load.d 曾被 initramfs-tools (MODULES=most) 打包进 initramfs →
#      initrd 阶段预加载 v4l2loopback → root 阶段全部改动无效。
#   改由 v4l2loopback-load.service (root, ExecStart=/sbin/modprobe v4l2loopback)
#   在 sysinit.target 阶段用 modprobe 命令加载 (参数完整解析, 与手动重载一致);
#   并须 sudo update-initramfs -u 同步 initramfs 内的 modules-load.d 为注释版。
# v4l2loopback
